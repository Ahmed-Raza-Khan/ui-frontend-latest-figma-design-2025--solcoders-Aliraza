<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="orentation.css">
</head>
<body>
    <h2>Use orientation: landscape</h2>

    <p><strong>Resize the browser window to see the effect.</strong></p>

    <p>When the width of this window is larger than the height,
        the background-color changes to "lightblue", otherwise it is "lightgreen".
    </p>


    <!-- Hide Element on Small Screens -->
    <!-- Resize the browser window to see the effect. -->
    <div id="div1">Some text.</div>


    <!-- Change font-size of an Element on Different Widths -->
    <!-- Resize the browser window to see the effect. -->
    <div id="div2">This is some text.</div>

    <br><br><br>

    <!-- Respect User Preferences -->
    <!-- The prefers-reduced-motion media feature checks if a user has asked to reduce motion, such as animations or transitions.
    Use this feature to turn off animations and transitions for the users who has activated this setting on their computer. -->
    <div class="div-motion"></div>
</body>
</html>
